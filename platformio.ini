[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

monitor_speed = 74880
upload_speed = 921600

board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson

build_flags =
    -Wall
    -D APP_VERSION=\"0.5.6-log-time-backfill\"

[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = 192.168.10.44

; If security.apiAuthEnabled=true and security.apiToken is set,
; OTA password must match security.apiToken from data/config.json.
upload_flags =
    --auth=Vurehek5
